name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "bridge/**"
      - "src/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
      - run: make web-assets
      # Switch to --immutable after a generated web/yarn.lock is committed.
      - run: yarn install --no-immutable
        working-directory: web
      - run: yarn build
        working-directory: web
        env:
          VITE_GITHUB_REPO: keredson/openpill
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
