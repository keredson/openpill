name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "bridge/**"
      - "src/**"
      - "Makefile"
      - "CMakeLists.txt"
      - "platformio.ini"
      - "sdkconfig.defaults"
      - "partitions.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Restore firmware build artifacts
        id: firmware-cache
        uses: actions/cache@v4
        with:
          path: web/public/firmware
          key: firmware-${{ runner.os }}-${{ hashFiles('src/**', 'bridge/src/**', 'CMakeLists.txt', 'bridge/CMakeLists.txt', 'platformio.ini', 'bridge/platformio.ini', 'sdkconfig.defaults', 'partitions.csv', 'Makefile', '.github/workflows/pages.yml') }}
      - uses: actions/setup-python@v5
        if: steps.firmware-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
        if: steps.firmware-cache.outputs.cache-hit != 'true'
      - name: Build Pill and bridge firmware assets
        if: steps.firmware-cache.outputs.cache-hit != 'true'
        run: make web-assets
      - name: Install PWA dependencies
        run: yarn install --immutable
        working-directory: web
      - name: Build PWA for /openpill/
        run: yarn build
        working-directory: web
        env:
          VITE_GITHUB_REPO: keredson/openpill
      - name: Verify deployable pages and firmware
        run: |
          test -f web/dist/index.html
          test -f web/dist/flash/index.html
          test -f web/dist/restore/index.html
          test -f web/dist/firmware/openpill.bin
          test -f web/dist/firmware/latest.json
          test -f web/dist/firmware/bridge-app.bin
          test -f web/dist/vendor/esptool-js-0.7.0.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
